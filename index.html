<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MusicTapGame</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- ホーム: 曲ライブラリ -->
  <section id="screen-home" class="screen">
    <header class="home-header">
      <h1 class="logo">Music<span>Tap</span></h1>
      <button class="icon-btn" id="open-settings" aria-label="設定">⚙</button>
    </header>
    <div class="home-actions single">
      <label class="btn primary">
        ＋ 曲を追加
        <input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.wav,.ogg" hidden>
      </label>
    </div>
    <p class="hint">mp3 などの音楽ファイルを選ぶと、自動で譜面を作ります。曲は端末の中だけに保存されます。</p>
    <ul id="song-list" class="song-list"></ul>
  </section>

  <!-- 曲詳細: 難易度選択 -->
  <section id="screen-song" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="戻る">‹</button>
      <div class="bar-title">
        <div id="song-title" class="song-title"></div>
        <div id="song-meta" class="song-meta"></div>
      </div>
    </header>
    <div id="difficulty-list" class="difficulty-list"></div>
    <div class="song-actions">
      <button class="btn primary big" id="start-game">LIVE START</button>
      <button class="btn small ghost" id="regenerate">譜面を作り直す</button>
    </div>
  </section>

  <!-- 解析中 -->
  <section id="screen-loading" class="screen center" hidden>
    <div class="loading-card">
      <div id="loading-text">解析中…</div>
      <div class="progress"><div id="loading-bar"></div></div>
    </div>
  </section>

  <!-- プレイ中 -->
  <section id="screen-play" class="screen passthrough" hidden>
    <button class="icon-btn pause-btn" id="pause-btn" aria-label="一時停止">Ⅱ</button>
    <div id="pause-menu" class="overlay" hidden>
      <div class="menu-card">
        <h2>PAUSE</h2>
        <button class="btn primary" id="resume-btn">再開</button>
        <button class="btn" id="retry-btn">リトライ</button>
        <button class="btn ghost" id="quit-btn">やめる</button>
      </div>
    </div>
  </section>

  <!-- リザルト -->
  <section id="screen-result" class="screen" hidden>
    <div class="result">
      <div id="result-song" class="result-song"></div>
      <div id="result-rank" class="rank"></div>
      <div id="result-badge" class="badge"></div>
      <div id="result-score" class="result-score">0</div>
      <div id="result-best" class="result-best"></div>
      <table class="result-table">
        <tr class="perfect"><th>PERFECT</th><td id="r-perfect"></td></tr>
        <tr class="great"><th>GREAT</th><td id="r-great"></td></tr>
        <tr class="good"><th>GOOD</th><td id="r-good"></td></tr>
        <tr class="miss"><th>MISS</th><td id="r-miss"></td></tr>
        <tr><th>MAX COMBO</th><td id="r-combo"></td></tr>
        <tr><th>タイミング</th><td id="r-timing"></td></tr>
      </table>
      <div class="result-actions">
        <button class="btn primary" id="result-retry">リトライ</button>
        <button class="btn" id="result-back">曲選択へ</button>
      </div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="screen-settings" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="戻る">‹</button>
      <div class="bar-title"><div class="song-title">設定</div></div>
    </header>
    <div class="settings">
      <label class="setting">
        <span>ノーツ速度 <b id="speed-value"></b></span>
        <input type="range" id="set-speed" min="1" max="12" step="0.5">
      </label>
      <label class="setting">
        <span>判定タイミング <b id="offset-value"></b></span>
        <input type="range" id="set-offset" min="-250" max="250" step="1">
        <small>叩くのが遅れがちならプラスへ。下のタイミング調整で自動測定できます。</small>
      </label>
      <button class="btn" id="open-calib">タイミング調整</button>
      <label class="setting">
        <span>曲の音量 <b id="music-vol-value"></b></span>
        <input type="range" id="set-music-vol" min="0" max="100" step="1">
      </label>
      <label class="setting">
        <span>タップ音の音量 <b id="hit-vol-value"></b></span>
        <input type="range" id="set-hit-vol" min="0" max="100" step="1">
      </label>
      <div class="setting">
        <span>背景画像</span>
        <div class="row">
          <label class="btn small">画像を選ぶ<input type="file" id="bg-input" accept="image/*" hidden></label>
          <button class="btn small ghost" id="bg-clear">なしにする</button>
        </div>
      </div>
      <label class="setting">
        <span>背景の暗さ <b id="bg-dim-value"></b></span>
        <input type="range" id="set-bg-dim" min="0" max="95" step="1">
      </label>
      <div class="setting">
        <span>初期曲</span>
        <button class="btn small" id="reinstall-builtins">初期曲を入れ直す</button>
      </div>
      <label class="setting check">
        <input type="checkbox" id="set-auto">
        <span>オートプレイ（譜面の確認用）</span>
      </label>
    </div>
  </section>

  <!-- タイミング調整 -->
  <section id="screen-calib" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="戻る">‹</button>
      <div class="bar-title"><div class="song-title">タイミング調整</div></div>
    </header>
    <div class="calib">
      <p>「スタート」を押すと一定のリズムで音が鳴ります。<br>画面を見ずに、音に合わせて下の円をタップしてください。</p>
      <div id="calib-pad" class="calib-pad">TAP</div>
      <div id="calib-result" class="calib-result">―</div>
      <div class="row">
        <button class="btn primary" id="calib-start">スタート</button>
        <button class="btn" id="calib-apply" disabled>この値を使う</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
